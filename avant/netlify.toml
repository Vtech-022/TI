# AVANT na Netlify. Ao criar o site, informe "avant" como diretório base (Base directory):
# a raiz deste repositório tem outro site com configuração própria.
[build]
  command = "npm run build:netlify"
  publish = "dist/netlify"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist", "exceljs", "mammoth"]

# Aplicativo de página única: qualquer endereço abre o index.html (a API fica em /api/*).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
